# Local run: app + PostgreSQL.
# Setup: cp .env.example .env, then set POSTGRES_PASSWORD in .env.
# Usage: docker compose up -d --build   (then: docker compose down)
# OPENAI_API_KEY is passed through from your shell; it is not stored in this file.

services:
  # ========================================
  # PostgreSQL Database Container
  # ========================================
  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflowdb}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - taskflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ========================================
  # Spring Boot Application Container
  # ========================================
  app:
    container_name: taskflow-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-taskflowdb}
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"
    build: .

# ========================================
# Volumes (Persistent Storage)
# ========================================
volumes:
  taskflow-db-data: