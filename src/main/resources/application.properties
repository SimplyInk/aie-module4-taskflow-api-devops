spring.application.name=taskflow-api
# Railway injects PORT at runtime; fall back to 8080 locally and in the Docker image
server.port=${PORT:8080}

logging.level.root=INFO

# # Database configuration
# spring.datasource.url=jdbc:h2:mem:taskflowdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# # JPA configuration
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true

# PostgreSQL
# Defaults are for local development; on Railway set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskflowdb}
# For WSL use: postgres
# For Mac use: your Mac username
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# Leave blank if authentication is set to trust in pg_hba.conf
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ⚠️ WARNING: 'create' drops and recreates ALL tables on every startup — all existing data will be lost.
# This is acceptable during early development, but switch to 'update' as soon as you want to keep your data.
spring.jpa.hibernate.ddl-auto=update
# Keeps existing data and updates the schema as needed.
# Using 'create' here would wipe the Railway database on every redeploy.
# Drops and recreates all tables on every startup: spring.jpa.hibernate.ddl-auto=create
# In production, use a migration tool like Flyway or Liquibase instead of ddl-auto.


# Spring AI - OpenRouter Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.model=openrouter/free
spring.ai.openai.embedding.model=nvidia/llama-nemotron-embed-vl-1b-v2:free
spring.ai.openai.embedding.encoding-format=float