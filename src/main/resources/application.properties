spring.application.name=taskflow-api
server.port=8088

logging.level.root=INFO

# # Database configuration
# spring.datasource.url=jdbc:h2:mem:taskflowdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=

# # JPA configuration
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/taskflowdb
# For WSL use: postgres
# For Mac use: your Mac username
spring.datasource.username=postgres
# Leave blank if authentication is set to trust in pg_hba.conf
spring.datasource.password=

# ⚠️ WARNING: 'create' drops and recreates ALL tables on every startup — all existing data will be lost.
# This is acceptable during early development, but switch to 'update' as soon as you want to keep your data.
spring.jpa.hibernate.ddl-auto=create
# Drops and recreates all tables on every startup.

# Use this instead when you want to keep existing data:
# spring.jpa.hibernate.ddl-auto=update
# Keeps existing data and updates the schema as needed.
# In production, use a migration tool like Flyway or Liquibase instead of ddl-auto.


# Spring AI - OpenRouter Configuration
#spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api/v1
spring.ai.openai.chat.model=openrouter/free
spring.ai.openai.embedding.model=nvidia/llama-nemotron-embed-vl-1b-v2:free
spring.ai.openai.embedding.encoding-format=float